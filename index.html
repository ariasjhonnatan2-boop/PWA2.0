<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Combustible Offline</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6ba4e8">
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #6ba4e8; --text: #e0e0e0; --border: #333; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 480px; background: var(--card); padding: 24px; border-radius: 12px; border: 1px solid var(--border); box-sizing: border-box; }
    h2 { margin-top: 0; color: #fff; font-size: 1.3rem; }
    .status-bar { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; font-weight: bold; text-align: center; background: #2a2a2a; line-height: 1.4; }
    label { display: block; margin-top: 12px; font-size: 0.85rem; color: #aaa; }
    input { width: 100%; padding: 12px; margin-top: 6px; background: #121212; border: 1px solid var(--border); border-radius: 6px; color: #fff; box-sizing: border-box; }
    input:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; padding: 14px; margin-top: 20px; background: var(--accent); color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

<div class="container">
  <h2>Control de Combustible</h2>
  <div id="status" class="status-bar">Inicializando base de datos local...</div>

  <form id="fuelForm">
    <label>Vehículo / Unidad</label>
    <input type="text" id="vehiculo" required placeholder="Ej. Camión 04">

    <label>Kilometraje</label>
    <input type="number" id="kilometraje" required placeholder="Ej. 145000">

    <label>Litros Cargados</label>
    <input type="number" step="0.01" id="litros" required placeholder="Ej. 60.5">

    <label>Chofer / Operador</label>
    <input type="text" id="chofer" required placeholder="Nombre del chofer">

    <button type="submit">Guardar Registro Offline</button>
  </form>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbySNFMDtC8frreTJAMQfTMKMkG6MqYtTCpk5qK4Y6VhnDc8WWXPfPL2k6cMw7hFqy4JZQ/exec";
  let db;
  let ultimaSincronizacion = "Ninguna";

  const request = indexedDB.open("FuelAppDB", 1);
  request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("registros")) {
      db.createObjectStore("registros", { keyPath: "uuid" });
    }
  };

  request.onsuccess = (e) => {
    db = e.target.result;
    actualizarInterfaz();
    sincronizarPendientes();
  };

  document.getElementById("fuelForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    
    // Obtener la fecha y hora exacta local en el momento de crear el registro en campo
    const ahora = new Date();
    const fechaLocalStr = ahora.getFullYear() + '-' + 
      String(ahora.getMonth() + 1).padStart(2, '0') + '-' + 
      String(ahora.getDate()).padStart(2, '0') + ' ' + 
      String(ahora.getHours()).padStart(2, '0') + ':' + 
      String(ahora.getMinutes()).padStart(2, '0') + ':' + 
      String(ahora.getSeconds()).padStart(2, '0');

    const registro = {
      uuid: 'fuel_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
      fechaCreacion: fechaLocalStr,
      vehiculo: document.getElementById("vehiculo").value,
      kilometraje: Number(document.getElementById("kilometraje").value),
      litros: Number(document.getElementById("litros").value),
      chofer: document.getElementById("chofer").value,
      sincronizado: false
    };

    const tx = db.transaction("registros", "readwrite");
    tx.objectStore("registros").add(registro);

    tx.oncomplete = async () => {
      document.getElementById("fuelForm").reset();
      actualizarInterfaz();

      if ('serviceWorker' in navigator && 'SyncManager' in window) {
        const reg = await navigator.serviceWorker.ready;
        try { await reg.sync.register('sync-combustible'); } catch (err) {}
      }
      sincronizarPendientes();
    };
  });

  async function sincronizarPendientes() {
    if (!navigator.onLine || !db) return;

    const tx = db.transaction("registros", "readonly");
    const store = tx.objectStore("registros");
    const registros = await new Promise(res => {
      store.getAll().onsuccess = (e) => res(e.target.result);
    });

    const pendientes = registros.filter(r => !r.sincronizado);
    if (pendientes.length === 0) {
      actualizarInterfaz();
      return;
    }

    const inicioTiempo = performance.now();

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(pendientes)
      });

      const duracion = ((performance.now() - inicioTiempo) / 1000).toFixed(2);
      ultimaSincronizacion = `${new Date().toLocaleTimeString()} (${duracion}s)`;

      const writeTx = db.transaction("registros", "readwrite");
      const writeStore = writeTx.objectStore("registros");
      pendientes.forEach(item => {
        item.sincronizado = true;
        writeStore.put(item);
      });

      writeTx.oncomplete = () => actualizarInterfaz();
    } catch (err) {
      console.error("Error sincronizando:", err);
    }
  }

  async function actualizarInterfaz() {
    const statusEl = document.getElementById("status");
    if (!db) return;

    const tx = db.transaction("registros", "readonly");
    const store = tx.objectStore("registros");
    store.getAll().onsuccess = (e) => {
      const all = e.target.result;
      const pendientes = all.filter(r => !r.sincronizado).length;

      if (!navigator.onLine) {
        statusEl.style.background = "#5a4300";
        statusEl.style.color = "#ffd700";
        statusEl.innerHTML = `SIN CONEXIÓN 🔴<br>Pendientes locales: ${pendientes} registros`;
      } else if (pendientes > 0) {
        statusEl.style.background = "#5a4300";
        statusEl.style.color = "#ffd700";
        statusEl.innerHTML = `CONECTADO 🟢<br>Sincronizando ${pendientes} registros pendientes...`;
      } else {
        statusEl.style.background = "#1b431c";
        statusEl.style.color = "#81c784";
        statusEl.innerHTML = `TODO SINCRONIZADO 🟢<br><span style="font-size:0.75rem; color:#a3d9a5;">Último envío: ${ultimaSincronizacion}</span>`;
      }
    };
  }

  window.addEventListener('online', () => { actualizarInterfaz(); sincronizarPendientes(); });
  window.addEventListener('offline', actualizarInterfaz);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>

</body>
</html>
